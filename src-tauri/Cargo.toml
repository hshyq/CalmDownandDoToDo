[package]
name = "calendar-todo"
version = "0.3.2"
description = "日历待办工具（Tauri 2 + React + SQLite）"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "calendar_todo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
# P8 备份导出/导入文件对话框（决策：官方插件，运行期零网络，经用户确认引入）
# P7 单实例互斥（决策 D9；官方插件，运行期零网络，经用户确认引入）
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# P1 数据层：SQLite（决策 D3 既定，bundled 免系统依赖；一期零网络 crate）
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

