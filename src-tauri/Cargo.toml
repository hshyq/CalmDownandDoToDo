[package]
name = "calendar-todo"
version = "0.1.0"
description = "日历待办工具（Tauri 2 + React + SQLite）"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "calendar_todo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
