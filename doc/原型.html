<!DOCTYPE html>
<!-- ============================================================
  日历待办工具 · UI 契约原型
  - 定位：开发前的 UI 契约，用户确认后作为开发基准
  - 单文件零依赖，双击浏览器即可演示
  - 纪律：只保留最新确认态；配色/间距用 CSS 变量集中定义（可搬为设计 token）
  - 演示已实现：标签页切换、周/月切换、前后导航、事项增/改/删与日历⇄待办动态迁移、
    日历格 hover「+」快捷新建（总览可新增、弹窗选分类）、待办分组折叠、+N 浮层、分类增删改/改色、字段管理界面
  - 演示未实现（正式版按文档实现）：撤销栈（10 步）、类型转换矩阵的实际数据迁移、
    备份导入导出、持久化（刷新即还原演示数据）
============================================================ -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>日历待办工具 · 交互原型</title>
<style>
:root{
  /* 演示用基础色（PRD 4.1 色盘为 11×6，选色面板见下方 .pal-grid）——开发阶段直接搬为设计 token */
  --c1:#4F8EF7;--c2:#34B96F;--c3:#F5A623;--c4:#E5534B;--c5:#9B59B6;
  --c6:#00B8D4;--c7:#FF7EB6;--c8:#8D6E63;--c9:#607D8B;--c10:#9E9E9E;
  --bg:#f4f5f7;--panel:#ffffff;--border:#e3e6ea;--text:#2b2f36;--muted:#8a919c;
  --accent:#4F8EF7;--danger:#E5534B;
  --radius:8px;--shadow:0 8px 28px rgba(30,40,60,.16);
  --bar-h:20px;--lane-step:22px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:13px/1.5 "Segoe UI","Microsoft YaHei",system-ui,sans-serif;color:var(--text);background:var(--bg);min-width:1080px}
button{font:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font:inherit;color:inherit}

/* ===== 顶部演示横幅 ===== */
.banner{height:32px;display:flex;align-items:center;justify-content:center;gap:8px;
  background:#FFF7E0;border-bottom:1px solid #f0e2b6;color:#8a6d1a;font-size:12px}

/* ===== 三栏骨架 ===== */
.app{display:flex;height:calc(100vh - 32px)}
/* 左：标签栏 */
.tabbar{width:160px;flex:none;background:var(--panel);border-right:1px solid var(--border);
  display:flex;flex-direction:column;padding:8px 6px;gap:2px}
.tab{display:flex;align-items:center;gap:7px;width:100%;padding:8px 8px;border-radius:6px;
  text-align:left;color:var(--text);position:relative}
.tab:hover{background:#f0f3f8}
.tab.active{background:#e8f0fe;font-weight:600}
.tab.active::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--accent)}
.tab .dotc{width:9px;height:9px;border-radius:3px;flex:none}
.tab .tname{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab .more{display:none;width:20px;height:20px;line-height:18px;text-align:center;border-radius:4px;color:var(--muted);flex:none}
.tab:hover .more{display:block}
.tab .more:hover{background:#dde4ee;color:var(--text)}
.tab-fixed-top{order:0}
.tab-fixed-bottom{margin-top:auto}
.tabbar .divider{height:1px;background:var(--border);margin:6px 4px}
.btn-newcat{margin:4px 0 0;padding:6px 8px;border:1px dashed var(--border);border-radius:6px;color:var(--muted);text-align:left}
.btn-newcat:hover{color:var(--accent);border-color:var(--accent)}
/* 中：主区 */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.toolbar{height:50px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--border)}
.toolbar .title{font-size:15px;font-weight:600;margin-right:6px;cursor:pointer}
.toolbar .title:hover{color:var(--accent)}
.tbtn{height:28px;padding:0 10px;border:1px solid var(--border);border-radius:6px;background:#fff;color:var(--text)}
.tbtn:hover{border-color:var(--accent);color:var(--accent)}
.tbtn.icon{width:28px;padding:0}.seg{display:flex;border:1px solid var(--border);border-radius:6px;overflow:hidden}
.seg button{height:26px;padding:0 12px;background:#fff;color:var(--muted)}
.seg button.on{background:var(--accent);color:#fff}
.spacer{flex:1}
.btn-primary{height:30px;padding:0 14px;border-radius:6px;background:var(--accent);color:#fff;font-weight:600}
.btn-primary:hover{filter:brightness(1.06)}
.btn-ghost{height:30px;padding:0 12px;border-radius:6px;border:1px solid var(--border);background:#fff}
.btn-danger{height:30px;padding:0 12px;border-radius:6px;background:var(--danger);color:#fff}
/* 日历 */
.content{flex:1;display:flex;min-height:0}
.calwrap{flex:1;overflow:auto;background:var(--panel);margin:10px;border:1px solid var(--border);border-radius:var(--radius)}
.calhead{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--border);background:#fafbfc;position:sticky;top:0;z-index:3}
.calhead div{padding:6px 8px;font-size:12px;color:var(--muted);text-align:center}
.weekrow{position:relative;display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--border)}
.weekrow:last-child{border-bottom:none}
.daycell{position:relative;border-right:1px solid var(--border);min-height:118px}
.daycell:nth-child(7){border-right:none}
.daycell .dnum{position:absolute;top:4px;left:8px;font-size:12px;color:var(--text);z-index:1}
.daycell.other .dnum{color:#c3c9d1}
/* 今日高亮（v1.16）：圆圈/描边/底色 = 当天日期类型的颜色（工作日蓝/休息日灰/假日红），原型确认中 */
.daycell.today{background:#eaf3ff;box-shadow:inset 0 0 0 1.5px var(--accent)}
.daycell.today.dt-rest{background:#f4f5f7;box-shadow:inset 0 0 0 1.5px #9AA5B1}
.daycell.today.dt-holiday{background:#fdeaea;box-shadow:inset 0 0 0 1.5px #E5534B}
.daycell.today .dnum{background:var(--accent);color:#fff;font-weight:700;border-radius:50%;width:21px;height:21px;display:inline-flex;align-items:center;justify-content:center;margin-top:1px}
.daycell.today.dt-rest .dnum{background:#9AA5B1}
.daycell.today.dt-holiday .dnum{background:#E5534B;color:#fff}
/* 日期类型（PRD 5.3 方案待确认）：格内数字右侧角标 班/休/假；法定假日数字红色 */
/* 日期类型角标：移至格子右上角（v1.16，原型已确认；数字左侧不再放角标） */
.dtype{position:absolute;top:3px;right:3px;font-size:9px;line-height:1;padding:2px 3px;border-radius:8px;color:#fff;font-weight:600;opacity:.92}

/* ===== 日期类型显示 5 方案（v1.16 演示切换，确认后固化所选） ===== */
.dstyle-sel{font-size:12px;padding:3px 4px;border:1px solid var(--border);border-radius:6px;color:var(--text);background:#fff}
/* ① 顶部小胶囊（仅覆盖项，顶部居中，与右上「+」零冲突） */
.dtype-top{position:absolute;top:2px;left:50%;transform:translateX(-50%);font-size:9px;line-height:1;padding:2px 5px;border-radius:8px;color:#fff;font-weight:600;cursor:pointer}
.dtype-top.work{background:#4F8EF7}.dtype-top.rest{background:#9AA5B1}.dtype-top.holiday{background:#E5534B}
/* ② 格底轻染（全部显示：默认周末浅灰、覆盖班浅蓝/覆盖休深灰/覆盖假浅红+红数字；点数字循环切换） */
.daycell.bg-rest-def{background:#f4f5f7}
.daycell.bg-ov-work{background:#e8f0fe}
.daycell.bg-ov-rest{background:#e5e7eb}
.daycell.bg-ov-holiday{background:#fdeaea}
/* ③ 数字下色条（仅覆盖项，数字下 3px 短条，点色条循环） */
.dtype-bar{position:absolute;left:5px;top:21px;width:16px;height:3px;border-radius:2px;cursor:pointer}
.dtype-bar.work{background:#4F8EF7}.dtype-bar.rest{background:#9AA5B1}.dtype-bar.holiday{background:#E5534B}
/* ④ 右下小图形（仅覆盖项，无文字：假=小旗/休=圆点/班=菱形） */
.dtype-shape{position:absolute;bottom:3px;right:4px;width:8px;height:8px;cursor:pointer}
.dtype-shape.dtype-holiday{background:#E5534B;clip-path:polygon(0 0,100% 0,0 100%)}
.dtype-shape.dtype-rest{background:#9AA5B1;border-radius:50%}
.dtype-shape.dtype-work{background:#4F8EF7;transform:rotate(45deg);width:7px;height:7px}
/* ⑤ 右上折角（仅覆盖项，贴角三角；hover「+」会临时盖住折角） */
.dtype-fold{position:absolute;top:0;right:0;width:0;height:0;border-style:solid;border-width:0 13px 13px 0;border-color:transparent;cursor:pointer}
.dtype-fold.dtype-holiday{border-top-color:#E5534B;border-right-color:#E5534B}
.dtype-fold.dtype-work{border-top-color:#4F8EF7;border-right-color:#4F8EF7}
.dtype-fold.dtype-rest{border-top-color:#9AA5B1;border-right-color:#9AA5B1}
.dtype.work{background:#4F8EF7}.dtype.rest{background:#9AA5B1}.dtype.holiday{background:#E5534B}
.daycell.holiday .dnum{color:#E5534B;font-weight:700}
.daycell:not(.other) .dtype{cursor:pointer}
/* 日期类型管理弹窗 */
.dt-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dt-cell{display:flex;align-items:center;gap:4px;height:40px;border:1px solid var(--border);border-radius:6px;cursor:pointer;padding:0 0 0 6px;font-size:12px;background:#fff}
.dt-cell:hover{border-color:var(--accent)}
.dt-cell.dim{color:#c3c9d1}
.dt-cell .dtype{position:static;flex:none}
.dt-legend{display:flex;gap:10px;margin-top:10px;font-size:11px;color:var(--muted);align-items:center;flex-wrap:wrap}
.dt-legend .dtype{position:static;display:inline-block;margin-right:3px}
.barlayer{position:absolute;inset:0;z-index:2;pointer-events:none}
.bar{position:absolute;height:var(--bar-h);border-radius:3px;font-size:12px;
  display:flex;align-items:center;padding:0 6px;overflow:hidden;white-space:nowrap;pointer-events:auto;cursor:grab}
.bar:hover{filter:brightness(1.08)}
.bar:active{cursor:grabbing}
.bar-grip{position:absolute;top:0;bottom:0;width:7px;cursor:ew-resize}
.bar-grip.g-left{left:0;border-radius:3px 0 0 3px}
.bar-grip.g-right{right:0;border-radius:0 3px 3px 0}
.bar-grip:hover{background:rgba(255,255,255,.4)}
.titem-day{flex:none;margin-left:6px;padding-right:2px;font-size:13px;font-weight:700;opacity:.92}
.daycell.dragover{outline:2px solid var(--accent);outline-offset:-2px;background:#eaf3ff}
.morechip{position:absolute;bottom:4px;right:6px;z-index:3;font-size:11px;color:var(--accent);
  background:#eaf3ff;border-radius:8px;padding:0 7px;cursor:pointer}
.morechip:hover{background:#d8e9ff}
.celladd{position:absolute;top:3px;right:6px;z-index:4;width:18px;height:18px;line-height:15px;text-align:center;border-radius:50%;background:#fff;border:1px solid var(--border);color:var(--accent);font-size:14px;font-weight:700;cursor:pointer;opacity:0;transition:opacity .12s;pointer-events:auto;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.daycell:hover .celladd{opacity:1}
.celladd:hover{background:#e8f0fe;border-color:var(--accent)}
/* 右：待办 */
.todo{width:280px;flex:none;background:var(--panel);border-left:1px solid var(--border);margin:10px 10px 10px 0;
  border-radius:var(--radius);display:flex;flex-direction:column;min-height:0}
.todo h3{font-size:13px;padding:10px 12px 8px;border-bottom:1px solid var(--border);color:var(--muted);font-weight:600}
.tlist{flex:1;overflow:auto;position:relative;padding:4px 12px 12px 30px}
.tlist.dragover{outline:2px dashed var(--accent);outline-offset:-4px;background:#f0f6ff}
.tlist::before{content:'';position:absolute;left:14px;top:12px;bottom:12px;width:2px;background:var(--border);border-radius:2px}
.thead{position:relative;display:flex;align-items:center;gap:8px;padding:9px 6px;cursor:pointer;border-radius:6px;user-select:none}
.thead:hover{background:#f4f6fa}
.thead .dot{position:absolute;left:-20px;width:10px;height:10px;border:2px solid #98a1ac;border-radius:50%;background:#fff;z-index:1}
.thead .tlabel{font-weight:600;font-size:12px}
.thead .tcount{font-size:11px;color:var(--muted)}
.thead .chev{margin-left:auto;color:var(--muted);transition:transform .15s}
.tgroup.collapsed .chev{transform:rotate(-90deg)}
.tgroup.collapsed .tbody{display:none}
.titem{position:relative;background:var(--c9);border-radius:8px;padding:5px 9px;margin:5px 0;display:flex;align-items:center;
  font-size:12px;cursor:grab;white-space:nowrap;overflow:hidden}
.titem .tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.titem:hover{filter:brightness(1.08)}
.titem:active{cursor:grabbing}
.tempty{color:var(--muted);font-size:12px;padding:14px 6px;text-align:center}
/* 当前时间线（PRD 5.2 v1.15）：插在「截止日≤今天」的最后一条之后 */
.nowline{display:flex;align-items:center;gap:6px;margin:7px 2px}
.nowtag{flex:none;font-size:11px;font-weight:700;color:#fff;background:var(--danger);border-radius:8px;padding:1px 7px}
.nowrule{flex:1;border-top:1.5px dashed var(--danger);opacity:.5}
/* 字段管理：全局字段 + 分类可见性（PRD 4.3 v1.17） */
.vis-tag{border:1px solid var(--border);background:#fff;border-radius:10px;padding:2px 8px;font-size:11px;color:var(--muted);cursor:pointer;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vis-tag:hover{border-color:var(--accent);color:var(--accent)}
.fm-vis{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:4px 8px 6px 26px;border-bottom:1px dashed var(--border)}
.vis-chip{display:inline-flex;align-items:center;gap:3px;border:1px solid var(--border);border-radius:10px;padding:1px 8px;font-size:11px;cursor:pointer;color:var(--text);user-select:none}
.vis-chip.on{border-color:var(--accent);background:#e8f0fe;color:var(--accent)}
.vis-chip input{display:none}
.fm-vis-tip{font-size:11px;color:var(--muted)}
/* 快捷范围按钮（导出 TXT，PRD 6.9） */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--border);background:#fff;border-radius:12px;padding:2px 11px;font-size:12px;cursor:pointer;color:var(--text)}
.chip:hover{border-color:var(--accent);color:var(--accent)}

/* ===== 弹窗 ===== */
.overlay{position:fixed;inset:0;background:rgba(24,30,40,.45);display:flex;align-items:center;justify-content:center;z-index:50}
.overlay.top{z-index:60}
.dialog{background:var(--panel);border-radius:12px;box-shadow:var(--shadow);width:520px;max-width:92vw;max-height:88vh;display:flex;flex-direction:column}
.dialog.small{width:380px}
.dhead{display:flex;align-items:center;padding:14px 16px 10px;font-size:15px;font-weight:600}
.dhead .x{margin-left:auto;width:26px;height:26px;border-radius:6px;color:var(--muted);text-align:center;line-height:24px}
.dhead .x:hover{background:#f0f3f8}
.dbody{padding:4px 16px 8px;overflow:auto}
.dfoot{display:flex;justify-content:flex-end;gap:8px;padding:10px 16px 14px}
.frow{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.frow>label{width:76px;flex:none;color:var(--muted);font-size:12px}
.frow input[type=text],.frow input[type=number],.frow input[type=date],.frow input[type=time],.frow select,.frow textarea{
  flex:1;border:1px solid var(--border);border-radius:6px;padding:6px 8px;background:#fff;min-width:0}
.frow textarea{min-height:56px;resize:vertical}
.frow input:focus,.frow select:focus,.frow textarea:focus{outline:none;border-color:var(--accent)}
/* 日期/时间控件：隐藏系统日历/挂钟图标；配合全局点击委托，点击输入框任意位置即打开选择器 */
/* 列表视图 v1.19：归属列 / 今日线 / 范围下拉 */
.lkind{white-space:nowrap;color:var(--muted)}
.lnowline td{border-top:1.5px dashed var(--danger);padding:3px 10px;background:#fff}
.lnow-mark{white-space:nowrap}
.lrange-sel{border:1px solid var(--border);border-radius:6px;padding:4px 6px;font:inherit;color:var(--text);background:#fff}

/* 列表视图：#cal 列布局约束（v1.19）——仅表格内部滚动，消除双滚动条 */
.calwrap.listmode{display:flex;flex-direction:column;overflow:hidden}
.calwrap.listmode .ltable-wrap{flex:1;min-height:0;height:auto}

/* 列表视图：今天标记与搜索（v1.19） */
.today-badge{display:inline-block;margin-left:5px;padding:0 5px;border-radius:8px;background:var(--accent);color:#fff;font-size:10px;font-weight:700;line-height:1.5;vertical-align:middle}
.lsearch{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--border)}
.lsearch input{flex:0 0 260px;border:1px solid var(--border);border-radius:6px;padding:4px 8px;font:inherit;color:var(--text);background:#fff}
.lsearch input:focus{outline:none;border-color:var(--accent)}
.lsearch .lsearch-count{font-size:12px;color:var(--muted)}

/* ===== 列表视图（v1.18）：全部日历+待办事项表格 =====
   分类/标题两列冻结（横向滚动时固定），标题列宽 20 个汉字超出换行；其余列内容宽、整表横向滚动 */
.ltable-wrap{flex:1;overflow:auto;height:100%}
.ltable{border-collapse:separate;border-spacing:0;font-size:12px;background:#fff}
.ltable th{position:sticky;top:0;background:var(--panel);border-bottom:1.5px solid var(--border);padding:7px 10px;text-align:left;font-weight:700;color:var(--muted);white-space:nowrap;z-index:2}
.ltable td{border-bottom:1px solid var(--border);padding:6px 10px;vertical-align:top;background:#fff}
/* 冻结列：分类（left:0）与标题（left:90px，宽 20 汉字超出换行） */
.ltable th:nth-child(1),.ltable td:nth-child(1){position:sticky;left:0;width:90px;min-width:90px;max-width:90px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:1}
.ltable th:nth-child(2),.ltable td:nth-child(2){position:sticky;left:90px;width:250px;min-width:250px;max-width:250px;white-space:normal;word-break:break-all;z-index:1}
.ltable th:nth-child(1),.ltable th:nth-child(2){z-index:3}
.ltable td.lcell{white-space:nowrap}
.ldim{opacity:.35}
.dotc{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
.lrow{cursor:pointer}
.lrow:hover td{background:#f0f6ff}
.lgroup td{position:sticky;left:0;background:#fafbfc;font-weight:700;color:var(--muted);padding:5px 10px;z-index:1;white-space:nowrap}

/* 分段日期/时刻输入（v1.17）：年4位/月2位/日2位满位自动跳段；图标弹原生选择器 */
.segwrap{display:inline-flex;align-items:center;border:1px solid var(--border);border-radius:6px;background:#fff;padding:0 4px;flex:1}
.segwrap:focus-within{border-color:var(--accent)}
.seg{border:none;outline:none;background:none;font:inherit;color:var(--text);text-align:center;padding:5px 0}
.seg-y{width:38px}.seg-m,.seg-d,.seg-h,.seg-mi{width:22px}
.seg::placeholder{color:var(--muted);opacity:.6}
.segsep{color:var(--border);margin:0 1px}
.segicon{flex:none;cursor:pointer;font-size:13px;opacity:.55;user-select:none;padding:0 2px}
.segicon:hover{opacity:1}
.seg-native{opacity:0;width:1px;height:1px;position:absolute;pointer-events:none}
.ferr{color:var(--danger);font-size:12px;padding:0 0 6px 86px;display:none}
.ferr.show{display:block}
.fsec{border-top:1px dashed var(--border);margin:12px 0 10px;padding-top:10px}
.fsec .sec-t{font-size:12px;color:var(--muted);margin-bottom:8px}
.fv-multi{display:flex;flex-wrap:wrap;gap:6px 12px;flex:1}
.fv-multi label{display:flex;align-items:center;gap:4px;color:var(--text);font-size:12px;width:auto}
/* 确认框 */
.cbody{padding:6px 16px 2px;color:var(--text);font-size:13px;line-height:1.7}
.cbody .sub{color:var(--muted);font-size:12px}
/* 弹出菜单 */

.popmenu button{display:block;width:100%;text-align:left;padding:7px 10px;border-radius:6px;color:var(--text)}
.popmenu button:hover{background:#f0f3f8}
.popmenu button.danger{color:var(--danger)}
.popmenu .pm-title{font-size:11px;color:var(--muted);padding:4px 10px 2px}
.palette{position:fixed;z-index:70;background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);padding:10px}
.pal-grid{display:grid;grid-template-columns:repeat(11,1fr);gap:5px}
.palette .sw{width:20px;height:20px;border-radius:4px;cursor:pointer;border:1px solid rgba(0,0,0,.08)}
.palette .sw.sel{outline:2px solid var(--accent);outline-offset:1px}
.palette .sw:hover{transform:scale(1.18)}
.more-colors{margin-top:8px;width:100%;border:1px solid var(--border);border-radius:6px;padding:5px 0;color:var(--muted)}
.more-colors:hover{color:var(--accent);border-color:var(--accent)}
.cp-sv{position:relative;height:140px;border-radius:8px;border:1px solid var(--border);cursor:crosshair;margin-bottom:10px}
.cp-huebar{position:relative;height:12px;border-radius:6px;margin-bottom:12px;background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);cursor:pointer}
.cp-dot{position:absolute;width:12px;height:12px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35);transform:translate(-50%,-50%);pointer-events:none}
.pick{position:fixed;z-index:70;background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);padding:10px;width:264px}
.pk-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.pk-head b{font-size:13px}
.pk-nav{width:24px;height:24px;border-radius:4px;color:var(--muted);text-align:center;line-height:22px}
.pk-nav:hover{background:#f0f3f8;color:var(--text)}
.pk-dow{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:2px}
.pk-dow span{font-size:11px;color:var(--muted);text-align:center}
.pk-weekrow{display:grid;grid-template-columns:repeat(7,1fr);border-radius:6px;cursor:pointer}
.pk-weekrow:hover{background:#f0f4fb}
.pk-weekrow.sel{background:#e8f0fe}
.pk-weekrow button{height:26px;font-size:12px;color:var(--text);border-radius:4px;position:relative}
.pk-weekrow button.dim{color:#c3c9d1}
.pk-weekrow button.today::after{content:'';position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--accent)}
.pk-months{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:4px}
.pk-months button{height:30px;border-radius:6px;border:1px solid var(--border);color:var(--text);background:#fff}
.pk-months button:hover{border-color:var(--accent);color:var(--accent)}
.pk-months button.on{background:var(--accent);border-color:var(--accent);color:#fff}
/* 字段管理 */
.fm-row{display:flex;align-items:center;gap:8px;padding:8px 6px;border-bottom:1px solid #f0f2f5}
.fm-row .fname{flex:1;font-weight:600}
.fm-row .ftype{color:var(--muted);font-size:12px;width:64px}
.fm-row .fopt{color:var(--muted);font-size:12px;width:56px}

.fm-row .op:hover{background:#eef2f8;color:var(--text)}
.fm-row .op.dis{opacity:.3;pointer-events:none}
.fm-form{border:1px solid var(--border);border-radius:8px;padding:10px;margin:10px 0}
/* 设置 */
.set-wrap{display:flex;min-height:300px}
.set-tabs{width:150px;border-right:1px solid var(--border);padding:8px 6px}
.set-tabs button{display:flex;align-items:center;gap:6px;width:100%;text-align:left;padding:8px 10px;border-radius:6px;color:var(--text)}
.set-tabs button.on{background:#e8f0fe;font-weight:600}
.set-tabs button.dis{color:#b9c0c9;cursor:not-allowed}
.set-tabs .badge{font-size:10px;background:#eef1f5;color:var(--muted);border-radius:8px;padding:0 6px}
.set-body{flex:1;padding:14px 16px}
.set-body .note{color:var(--muted);font-size:12px;line-height:1.8;margin-top:10px}

.daylist .dl-row:hover{background:#f0f3f8}

/* Toast */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:6px;align-items:center}
.toast{background:#2c313a;color:#fff;border-radius:8px;padding:8px 16px;font-size:12px;box-shadow:var(--shadow);opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
::-webkit-scrollbar{width:8px;height:8px}

const PAL_ROWS=[

const STD_ROW=PAL_ROWS[2]; // 标准行（第 3 行，标准饱和档）：新建分类的默认色取此行中使用最少的颜色

}
function hexRgb(h){return [1,3,5].map(i=>parseInt(h.slice(i,i+2),16))}

/* 色块文字颜色自适应（PRD 5.4 v1.9）：亮背景（YIQ>160）深字，暗背景白字 */

/* ================= 工具 ================= */
const $=s=>document.querySelector(s);
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}
function pad(n){return String(n).padStart(2,'0')}
function parseD(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function fmtD(dt){return dt.getFullYear()+'-'+pad(dt.getMonth()+1)+'-'+pad(dt.getDate())}
function addDays(s,n){const dt=parseD(s);dt.setDate(dt.getDate()+n);return fmtD(dt)}
function diffDays(a,b){return Math.round((parseD(b)-parseD(a))/86400000)} // b-a
function weekStart(s){const dt=parseD(s);const idx=(dt.getDay()+6)%7;dt.setDate(dt.getDate()-idx);return fmtD(dt)}
function daysInMonth(s){const[y,m]=s.split('-').map(Number);return new Date(y,m,0).getDate()}
function isChoice(t){return t==='single_choice'||t==='multi_choice'}
const TYPE_LABEL={text:'单行文本',multiline:'多行文本',number:'数字',date:'日期',single_choice:'单选',multi_choice:'多选'};
function catOf(id){return state.categories.find(c=>c.id===id)}
/* 日期类型（PRD 5.3 方案待确认）：覆盖项优先，否则周一~五工作日/周六日休息日 */
function dayTypeOf(ds){
  if(state.dayTypes[ds])return state.dayTypes[ds];
  const w=parseD(ds).getDay();return (w===0||w===6)?'rest':'work';
}
const DTYPE_LABEL={work:'班',rest:'休',holiday:'假'};
const DTYPE_CYCLE={'':'work',work:'rest',rest:'holiday',holiday:''}; // 点击循环：默认→班→休→假→清除
function fieldsOf(id){return state.fields.filter(f=>f.vis.includes(id)).slice().sort((a,b)=>a.sort-b.sort)}
function activeCatId(){return state.activeTab===OVERVIEW?null:state.activeTab}

function toast(msg){
  const t=document.createElement('div');t.className='toast';t.textContent=msg;$('#toast').appendChild(t);
  requestAnimationFrame(()=>t.classList.add('show'));
  setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),300)},2200);
}

/* ================= 标签栏 ================= */
function renderTabs(){
  const cats=state.categories.filter(c=>c.kind==='normal');
  const unc=state.categories.find(c=>c.kind==='uncategorized');
  const tab=(c,fixedTop)=>`
    <div class="tab ${(c.id?state.activeTab===c.id:state.activeTab===OVERVIEW)?'active':''} ${fixedTop?'tab-fixed-top':''}" onclick="switchTab('${c.id||OVERVIEW}')">
      ${c.id?`<span class="dotc" style="background:${c.color}"></span>`:''}
      <span class="tname" title="${esc(c.name)}">${esc(c.name)}</span>
      ${c.id?`<span class="more" onclick="openMenu(${c.id},this)">⋮</span>`:''}
    </div>`;
  let html=tab({name:'总览'},true);
  html+=cats.map(c=>tab(c)).join('');
  html+=`<button class="btn-newcat" onclick="openNewCat()">＋ 新建分类</button>`;
  html+=`<div class="tab-fixed-bottom">${tab(unc)}<div class="divider"></div>
    <div class="tab" onclick="openSettings()"><span class="tname">⚙ 设置</span></div></div>`;
  $('#tabbar').innerHTML=html;
}
function switchTab(id){state.activeTab=id===OVERVIEW?OVERVIEW:Number(id);renderAll()}

/* ===== 分类菜单（⋮） ===== */
/* ===== 弹出层统一管理：支持"再次点击同一入口=关闭" ===== */
let popOpen=null,popAnchor=null;
function closePop(){$('#menu-root').innerHTML='';popOpen=null}
function popOutside(e){
  if(!e.target.closest('.popmenu,.palette,.pick')&&!e.target.closest('.more')&&!e.target.closest('.title'))closePop();
}
function showPop(el,html,tag,cls){
  closePop();
  popOpen=tag;popAnchor=el.getBoundingClientRect();
  const p=document.createElement('div');p.className=cls||'popmenu';p.innerHTML=html;
  p.addEventListener('click',e=>e.stopPropagation());
  $('#menu-root').appendChild(p);
  const w=p.offsetWidth,h=p.offsetHeight;
  p.style.left=Math.max(8,Math.min(popAnchor.left,window.innerWidth-w-8))+'px';
  p.style.top=(popAnchor.bottom+6+h>window.innerHeight-8?Math.max(8,popAnchor.top-h-6):popAnchor.bottom+6)+'px';
}
function openMenu(catId,el){
  const tag='menu-'+catId;
  if(popOpen===tag){closePop();return}
  closePop();
  const c=catOf(catId);
  const items = c.kind==='normal'
    ? `<button onclick="openPalette(${catId},this)">设置颜色</button>
       <button onclick="openRename(${catId})">重命名</button>
       <button class="danger" onclick="openDelCat(${catId})">删除</button>`
    : `<button onclick="openPalette(${catId},this)">设置颜色</button>`;
  showPop(el,items,tag);
}
function openPalette(catId,el){
  const tag='pal-'+catId;
  if(popOpen===tag){closePop();return}
  closePop();
  const cur=catOf(catId).color.toLowerCase();
  const grid=PAL_ROWS.map(row=>row.map(c=>
    `<div class="sw ${c===cur?'sel':''}" style="background:${c}" title="${c}" onclick="pickColor(${catId},'${c}')"></div>`).join('')).join('');
  showPop(el,`<div class="pal-grid">${grid}</div><button class="more-colors" onclick="openCustomColor(${catId})">更多颜色</button>`,tag,'palette');
}
/* 更多颜色：墨刀式取色面板（SV 渐变区 + 色相条 + HEX，PRD 4.1 v1.9） */
let cpHsv={h:0,s:0,v:0};
function hsv2hex(h,s,v){s/=100;v/=100;const c=v*s,x=c*(1-Math.abs((h/60)%2-1)),m=v-c;
  const seg=Math.floor(h/60),rgb=seg===0?[c,x,0]:seg===1?[x,c,0]:seg===2?[0,c,x]:seg===3?[0,x,c]:seg===4?[x,0,c]:[c,0,x];
  return rgbHex((rgb[0]+m)*255,(rgb[1]+m)*255,(rgb[2]+m)*255)}
function hex2hsv(hex){const[r,g,b]=hexRgb(hex).map(v=>v/255);
  const max=Math.max(r,g,b),min=Math.min(r,g,b),d=max-min;let h=0;
  if(d){if(max===r)h=((g-b)/d)%6;else if(max===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;if(h<0)h+=360}
  return{h,s:max?d/max*100:0,v:max*100}}
function cpApply(){const hex=hsv2hex(cpHsv.h,cpHsv.s,cpHsv.v);
  $('#cp-prev').style.background=hex;$('#cp-hex').value=hex.toUpperCase();
  $('#cp-sv').style.background=`linear-gradient(to top,#000,transparent),linear-gradient(to right,#fff,${hsv2hex(cpHsv.h,100,100)})`;
  $('#cp-svdot').style.left=cpHsv.s+'%';$('#cp-svdot').style.top=(100-cpHsv.v)+'%';$('#cp-svdot').style.background=hex;
  $('#cp-huedot').style.left=(cpHsv.h/360*100)+'%';$('#cp-huedot').style.background=hsv2hex(cpHsv.h,100,100)}
function cpFromEvent(e,isHue){const rect=e.currentTarget.getBoundingClientRect();
  const x=Math.max(0,Math.min(1,(e.clientX-rect.left)/rect.width));
  if(isHue)cpHsv.h=x*360;else{cpHsv.s=x*100;cpHsv.v=(1-Math.max(0,Math.min(1,(e.clientY-rect.top)/rect.height)))*100}
  cpApply()}
function cpFromHex2(){let v=$('#cp-hex').value.trim();
  if(/^#?[0-9a-fA-F]{6}$/.test(v)){if(!v.startsWith('#'))v='#'+v;cpHsv=hex2hsv(v);cpApply()}
  else $('#cp-hex').style.borderColor='var(--danger)'}

function renderListTable(){
  const scope=activeCatId();
  const q=listQuery.trim().toLowerCase();
  const today=todayStr();
  const rb=(listRange==='all'||listRange==='custom')?null:(()=>{
    const s=listRange==='w'?addDays(today,7):addMonthsM1(today,listRange==='m1'?1:2);
    return {s:today,e:s};
  })();
  const cs=(listRange==='custom'&&listCS)?listCS:null;
  const ce=(listRange==='custom'&&listCE)?listCE:null;
  const all=state.items.filter(it=>{
    if(!(scope===null||it.cat===scope))return false;
    if(q!==''&&!it.title.toLowerCase().includes(q))return false;
    if(rb||cs){
      const s=rb?rb.s:cs,e=rb?rb.e:ce;
      if(!s||!e)return true;
      if(it.sd&&it.ed){if(!(it.sd<=e&&it.ed>=s))return false;}
      else{if(!it.dd||it.dd<s||it.dd>e)return false;}
    }
    return true;
  });
  const defs=[...state.fields].sort((a,b)=>a.sort-b.sort);
  // 排序：结束日期升序；无结束以截止参与；均无沉底（v1.19）
  const sortKey=it=>it.ed||it.dd||'9999-12-31';
  const sorted=[...all].sort((a,b)=>{
    const ka=sortKey(a),kb=sortKey(b);
    return ka<kb?-1:ka>kb?1:a.id-b.id;
  });
  // 今日线：排序后「结束/截止≤今天」的最后一条之后（v1.19）
  let nowIdx=0;
  sorted.forEach((it,i)=>{if(sortKey(it)<=today)nowIdx=i+1;});
  const fmt=(d,t)=>{
    if(!d)return '<span class="ldim">—</span>';
    return d+(t?` ${t}`:'');
  };
  const row=it=>{
    const c=catOf(it.cat);
    const kind=(it.sd&&it.ed)?'日历':'待办';
    const fvcell=f=>{
      const v=it.fv[f.id];
      const txt=v===undefined||v===null?'':(Array.isArray(v)?v.join('、'):String(v));
      return txt===''?'<td class="lcell"><span class="ldim">—</span></td>':`<td class="lcell">${esc(txt)}</td>`;
    };
    return `<tr class="lrow" onclick="openItemModal(${it.id})">
      <td><span class="dotc" style="background:${c.color}"></span>${esc(c.name)}</td>
      <td class="ltitle">${esc(it.title)}</td>
      <td class="lkind">${kind}</td>
      <td class="lcell">${fmt(it.sd,it.st)}</td>
      <td class="lcell">${fmt(it.ed,it.et)}</td>
      <td class="lcell">${fmt(it.dd,it.dt)}</td>
      ${defs.map(fvcell).join('')}
    </tr>`;
  };
  const nowRow=()=>`<tr class="lnowline">${'<td></td>'.repeat(6+defs.length)}</tr>`;
  let rows='';
  let gi=0;
  if(nowIdx===0)rows+=nowRow();
  for(const it of sorted){
    rows+=row(it);
    gi++;
    if(gi===nowIdx)rows+=nowRow();
  }
  const lc=document.getElementById('lcount');
  if(lc)lc.textContent=`共 ${all.length} 条`;
  document.getElementById('ltablewrap').innerHTML=`<table class="ltable">
    <thead><tr>
      <th>分类</th><th>标题</th><th>归属</th><th>开始</th><th>结束</th><th>截止</th>
      ${defs.map(f=>`<th>${esc(f.name)}</th>`).join('')}
    </tr></thead><tbody>${rows}</tbody></table>`;
}
function addMonthsM1(t,months){ // t + N 个月 − 1 天（目标月无同日钳到月末再减一天）
  const [y,m,d]=t.split('-').map(Number);
  const tt=y*12+(m-1)+months,y2=Math.floor(tt/12),m2=tt%12+1;
  const dim=(yy,mm)=>mm===2?((yy%4===0&&yy%100!==0)||yy%400===0?29:28):[31,28,31,30,31,30,31,31,30,31,30,31][mm-1];
  const cl=Math.min(d,dim(y2,m2));
  if(cl>=2)return `${y2}-${String(m2).padStart(2,'0')}-${String(cl-1).padStart(2,'0')}`;
  const t2=y2*12+(m2-1)-1,y3=Math.floor(t2/12),m3=t2%12+1;
  return `${y3}-${String(m3).padStart(2,'0')}-${String(dim(y3,m3)).padStart(2,'0')}`;
}

function initSegs(root){
  root.querySelectorAll('.segwrap').forEach(w=>{
    const segs=[...w.querySelectorAll('.seg')];
    const icon=w.querySelector('.segicon'),native=w.querySelector('.seg-native');
    segs.forEach((seg,i)=>{
      // 聚焦/点击即全选本段：键入直接覆盖（对齐原生控件的分段选中体验）
      const selAll=()=>seg.select();
      seg.addEventListener('focus',selAll);
      seg.addEventListener('click',selAll);
      seg.addEventListener('input',()=>{
        seg.value=seg.value.replace(/\D/g,'').slice(0,seg.maxLength);
        if(seg.value.length>=seg.maxLength&&i<segs.length-1)segs[i+1].focus();
      });
      seg.addEventListener('keydown',e=>{
        if(e.key==='Backspace'&&!seg.value&&i>0){segs[i-1].focus();e.preventDefault()}
      });
    });
    if(icon)icon.addEventListener('click',()=>{try{native.showPicker()}catch(_){native.focus()}});
    if(native)native.addEventListener('change',()=>{
      const v=native.value;if(!v)return;
      const parts=icon.textContent.includes('日')?v.split('-'):v.split(':');
      parts.forEach((pv,idx)=>{if(segs[idx])segs[idx].value=pv});
    });
  });
}

let wheelAcc=0,wheelT=0;

/* 周内横条布局：与正式版同思路（截断→排序→贪心泳道） */
function layoutWeek(weekDates,maxLanes,scope){
  const s=weekDates[0],e=weekDates[6];
  const evs=state.items.filter(it=>(scope===null||it.cat===scope)&&it.sd&&it.ed&&it.sd<=e&&it.ed>=s)
    .map(it=>({it,cs:diffDays(s,it.sd<s?s:it.sd),ce:diffDays(s,it.ed>e?e:it.ed),st:it.st||'00:00'}))
    .sort((a,b)=>a.cs-b.cs||a.st.localeCompare(b.st)||a.ce-b.ce||a.it.id-b.it.id);
  const laneEnd=[],out=[];
  for(const ev of evs){
    let l=0;while(l<laneEnd.length&&laneEnd[l]>=ev.cs)l++;
    if(l>=maxLanes){out.push({...ev,lane:-1});continue}
    laneEnd[l]=ev.ce;out.push({...ev,lane:l});
  }
  return out;
}
function renderCalendar(){
  if(state.view==='list'){
    $('#cal').className='calwrap listmode';
    $('#cal').innerHTML=`<div class="lsearch" id="lsearchbox"></div><div class="ltable-wrap" id="ltablewrap"></div>`;
    renderListFilter();
    renderListTable();
    return;
  }
  const head=['周一','周二','周三','周四','周五','周六','周日']
    .map(d=>`<div>${d}</div>`).join('');
  let rows;
  if(state.view==='week'){
    const s=weekStart(state.cursor);
    rows=[[...Array(7)].map((_,i)=>addDays(s,i))];
  }else{
    const first=state.cursor.slice(0,8)+'01';
    const ws=weekStart(first);
    const total=diffDays(ws,first)+daysInMonth(state.cursor);
    const nRows=Math.ceil(total/7);
    rows=[...Array(nRows)].map((_,r)=>[...Array(7)].map((_,i)=>addDays(ws,r*7+i)));
  }
  const maxLanes=state.view==='week'?10:4;
  const cellH=state.view==='week'?242:118;
  let html=`<div class="calhead">${head}</div>`;
  for(const week of rows){
    const scope=activeCatId();
    const placed=layoutWeek(week,maxLanes,scope);
    const cells=week.map(ds=>{
      const other=state.view==='month'&&ds.slice(0,7)!==state.cursor.slice(0,7);
      const dt=dayTypeOf(ds);
      const ov=!!state.dayTypes[ds];
      // 日期类型显示方案（v1.16 演示切换）；样式③（选定方向）：每天显示色条、今天格不显示（类型由今日圆圈颜色表达）
      let bgCls='',mark='',dnumClick='';
      if(state.dtypeStyle==='1'){ if(ov)mark=`<span class="dtype-top ${dt}" onclick="event.stopPropagation();dtCycle('${ds}')" title="点击切换日期类型（班/休/假/清除）">${DTYPE_LABEL[dt]}</span>`; }
      else if(state.dtypeStyle==='2'){ bgCls=ov?(' bg-ov-'+dt):(dt==='rest'?' bg-rest-def':''); dnumClick=`onclick="event.stopPropagation();dtCycle('${ds}')" title="点击切换日期类型（班/休/假/清除）"`; }
      else if(state.dtypeStyle==='3'){ if(ds!==TODAY)mark=`<span class="dtype-bar ${dt}" onclick="event.stopPropagation();dtCycle('${ds}')" title="点击切换日期类型（班/休/假/清除）"></span>`; }
      else if(state.dtypeStyle==='4'){ if(ov)mark=`<span class="dtype-shape dtype-${dt}" onclick="event.stopPropagation();dtCycle('${ds}')" title="点击切换日期类型"></span>`; }
      else if(state.dtypeStyle==='5'){ if(ov)mark=`<span class="dtype-fold dtype-${dt}" onclick="event.stopPropagation();dtCycle('${ds}')" title="点击切换日期类型"></span>`; }
      return `<div class="daycell ${other?'other':''} ${ds===TODAY?'today dt-'+dt:''} ${dt==='holiday'?'holiday':''}${bgCls}" data-d="${ds}"
        ondragover="cellDragOver(event)" ondragleave="cellDragLeave(event)" ondrop="cellDrop(event,'${ds}')">
        <span class="dnum" ${dnumClick}>${Number(ds.slice(8))}</span>${mark}<span class="celladd" title="新增事项" onclick="openItemModal(null,'${ds}')">+</span></div>`;
    }).join('');
    const bars=placed.filter(p=>p.lane>=0).map(p=>{
      const c=catOf(p.it.cat);
      return `<div class="bar" style="left:calc(${p.cs*100/7}% + 3px);width:calc(${(p.ce-p.cs+1)*100/7}% - 6px);
        top:${23+p.lane*22}px;background:${c.color};color:${textColorOn(c.color)}" title="${esc(p.it.title)}" draggable="true"
        ondragstart="dragBar(event,${p.it.id})"
        onclick="openItemModal(${p.it.id})">${esc(p.it.title)}<span class="bar-grip g-left" onmousedown="gripDown(event,${p.it.id},'start')"></span><span class="bar-grip g-right" onmousedown="gripDown(event,${p.it.id},'end')"></span></div>`;
    }).join('');
    const chips=[...Array(7)].map((_,d)=>{
      const n=placed.filter(p=>p.lane===-1&&p.cs<=d&&d<=p.ce).length;
      return n?`<span class="morechip" style="right:calc(${(6-d)*100/7}% + 6px)" onclick="openDayOverlay('${week[d]}')">+${n}</span>`:'';
    }).join('');
    html+=`<div class="weekrow" style="height:${cellH}px"><div class="barlayer">${bars}${chips}</div>${cells}</div>`;
  }
  $('#cal').className='calwrap';
  $('#cal').innerHTML=html;
}

/* ================= 拖拽改期（PRD 5.3 v1.8） ================= */
/* 来源类型区分：日历横条平移起止日期（跨度/时分不变）；待办条目设开始=结束=落格日期 */
const MIME_BAR='application/x-cal-bar',MIME_TODO='application/x-cal-todo';
function dragBar(e,id){e.dataTransfer.setData(MIME_BAR,String(id));e.dataTransfer.effectAllowed='copyMove'}
function dragTodo(e,id){e.dataTransfer.setData(MIME_TODO,String(id));e.dataTransfer.effectAllowed='copyMove'}
function cellDragOver(e){
  const t=e.dataTransfer.types;
  if(t.includes(MIME_BAR)||t.includes(MIME_TODO)){
    e.preventDefault();e.dataTransfer.dropEffect='copy';
    const cell=e.target.closest('.daycell');if(cell)cell.classList.add('dragover');
  }
}
function cellDragLeave(e){
  const cell=e.target.closest('.daycell');if(cell)cell.classList.remove('dragover');
}
function cellDrop(e,ds){
  e.preventDefault();
  const cell=e.target.closest('.daycell');if(cell)cell.classList.remove('dragover');
  const bar=e.dataTransfer.getData(MIME_BAR);
  if(bar){
    const it=state.items.find(x=>x.id===Number(bar));if(!it)return;
    const off=diffDays(it.sd,ds);
    it.sd=addDays(it.sd,off);it.ed=addDays(it.ed,off);
    toast('已更新日期');renderCalendar();return;
  }
  const todo=e.dataTransfer.getData(MIME_TODO);
  if(todo){
    const it=state.items.find(x=>x.id===Number(todo));if(!it)return;
    it.sd=ds;it.ed=ds;
    toast('已更新日期');renderCalendar();renderTodo();return;
  }
}
/* 日历横条拖入待办面板（v1.16，用户确认）：结束日期→截止日期、结束时刻→截止时刻，清空结束日期/时刻；开始信息保留 */
function todoPaneDragOver(e){
  if(e.dataTransfer.types.includes(MIME_BAR)){
    e.preventDefault();e.dataTransfer.dropEffect='copy';
    e.currentTarget.classList.add('dragover');
  }
}
function todoPaneDragLeave(e){e.currentTarget.classList.remove('dragover')}
function todoPaneDrop(e){
  e.preventDefault();e.currentTarget.classList.remove('dragover');
  const bar=e.dataTransfer.getData(MIME_BAR);if(!bar)return;
  const it=state.items.find(x=>x.id===Number(bar));if(!it||!it.ed)return;
  it.dd=it.ed;it.dt=it.et||'';it.ed='';it.et='';
  toast(`已转为待办：${it.title}（截止 ${it.dd}${it.dt?' '+it.dt:''}）`);
  renderCalendar();renderTodo();
}
/* 横条头尾拖拽改期（PRD 5.3 v1.11）：拖左缘改开始、拖右缘改结束；钳制不越界 */
let barResize=null;
function gripDown(e,id,edge){
  e.preventDefault();e.stopPropagation();
  const it=state.items.find(x=>x.id===id);if(!it)return;
  barResize={id,edge,base:{sd:it.sd,ed:it.ed},cur:{sd:it.sd,ed:it.ed}};
  const move=ev=>{
    if(!barResize)return;
    let date=null;
    for(const el of document.elementsFromPoint(ev.clientX,ev.clientY)){
      const d=el.getAttribute&&el.getAttribute('data-d');if(d){date=d;break}
    }
    if(!date)return;
    if(barResize.edge==='start')barResize.cur.sd=date<barResize.cur.ed?date:barResize.cur.ed;
    else barResize.cur.ed=date>barResize.cur.sd?date:barResize.cur.sd;
    const target=state.items.find(x=>x.id===id);
    target.sd=barResize.cur.sd;target.ed=barResize.cur.ed;renderCalendar();
  };
  const up=()=>{
    document.removeEventListener('mousemove',move);document.removeEventListener('mouseup',up);
    const changed=barResize&&(barResize.cur.sd!==barResize.base.sd||barResize.cur.ed!==barResize.base.ed);
    barResize=null;
    if(changed)toast('已更新日期');
  };
  document.addEventListener('mousemove',move);document.addEventListener('mouseup',up);
}

/* ================= 待办 ================= */
function renderTodo(){
  const scope=activeCatId();
  const todos=state.items.filter(it=>(!it.sd||!it.ed)&&(scope===null||it.cat===scope))
    .sort((a,b)=>{
      const ka=a.dd?a.dd+a.dt:'9999',kb=b.dd?b.dd+b.dt:'9999';
      return ka<kb?-1:ka>kb?1:a.id-b.id;
    });
  const groups={};
  todos.forEach(it=>{const k=it.dd?it.dd.slice(0,7):'unset';(groups[k]=groups[k]||[]).push(it)});
  const keys=Object.keys(groups).sort();
  if(keys.includes('unset')){keys.splice(keys.indexOf('unset'),1);keys.push('unset')}
  // 当前时间线插入点：排序后「截止日≤今天」的最后一条之后；全部在未来则插在最前（PRD 5.2 v1.15）
  const now=new Date(), pad=n=>String(n).padStart(2,'0');
  const today=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
  let nowIdx=0;
  todos.forEach((it,i)=>{if(it.dd&&it.dd<=today)nowIdx=i+1});
  let gi=0;
  const nowline=()=>`<div class="nowline"><span class="nowtag">今天 ${today.slice(5)}</span><span class="nowrule"></span></div>`;
  let html='';
  if(!keys.length){html=`<div class="tempty">当前范围暂无待办</div>`}
  for(const k of keys){
    const label=k==='unset'?'长期规划':k;
    const col=groups[k];
    let body='';
    if(gi===nowIdx)body+=nowline();
    body+=col.map(it=>{
      const c=catOf(it.cat);
      const tip=it.dd?`截止 ${it.dd}${it.dt?' '+it.dt:''}｜${c.name}`:c.name;
      let h=`<div class="titem" style="background:${c.color};color:${textColorOn(c.color)}" title="${esc(it.title+'（'+tip+'）')}" draggable="true"
        ondragstart="dragTodo(event,${it.id})"
        onclick="openItemModal(${it.id})"><span class="tt">${esc(it.title)}</span><span class="titem-day">${it.dd?Number(it.dd.slice(8,10)):'—'}</span></div>`;
      gi++;
      if(gi===nowIdx)h+=nowline();
      return h;
    }).join('');
    html+=`<div class="tgroup ${state.collapsed[k]?'collapsed':''}">
      <div class="thead" onclick="toggleGroup('${k}')">
        <span class="dot"></span><span class="tlabel">${label}</span>
        <span class="tcount">${col.length} 条</span><span class="chev">▾</span>
      </div>
      <div class="tbody">${body}</div></div>`;
  }
  $('#todolist').innerHTML=html;
}
function toggleGroup(k){state.collapsed[k]=!state.collapsed[k];renderTodo()}

/* ================= 弹窗基座 ================= */
function modal(inner,topmost,dismissable){
  // dismissable=true 时点击遮罩（弹窗以外区域）关闭弹窗；默认不关闭，仅事项弹窗开启（对齐 v0.3.2+ 实现与 TC-IT-014）
  const root=topmost?$('#confirm-root'):$('#modal-root');
  root.innerHTML=`<div class="overlay ${topmost?'top':''}" onclick="if(event.target===this&&${!!dismissable})closeModal(${topmost})"><div class="dialog">${inner}</div></div>`;
}
function closeModal(topmost){
  (topmost?$('#confirm-root'):$('#modal-root')).innerHTML='';
}
function confirmBox(msg,opts={}){
  const acts=[{text:'取消',cls:'btn-ghost',fn:null},...(opts.buttons||[{text:opts.okText||'确定',cls:opts.danger?'btn-danger':'btn-primary',fn:opts.onOk}])];
  window.__cfns=acts.map(a=>()=>{closeConfirm();a.fn&&a.fn()});
  const btns=acts.map((a,i)=>`<button class="${a.cls}" onclick="window.__cfns[${i}]()">${a.text}</button>`).join('');
  $('#confirm-root').innerHTML=`<div class="overlay top" onclick="if(event.target===this)closeConfirm()">
    <div class="dialog small"><div class="dhead">提示<button class="x" onclick="closeConfirm()">✕</button></div>
    <div class="cbody">${msg}</div><div class="dfoot">${btns}</div></div></div>`;
}
function closeConfirm(){$('#confirm-root').innerHTML=''}

/* ================= 事项弹窗（新增/编辑） ================= */
function fvInput(f,val){
  const name=`data-fv="${f.id}"`;
  if(f.type==='text')return `<input type="text" ${name} value="${esc(val||'')}">`;
  if(f.type==='multiline')return `<textarea ${name}>${esc(val||'')}</textarea>`;
  if(f.type==='number')return `<input type="number" ${name} value="${esc(val||'')}">`;
  if(f.type==='date')return `<input type="date" ${name} value="${esc(val||'')}">`;
  if(f.type==='single_choice'){
    return `<select ${name}><option value="">（未选）</option>${f.options.map(o=>`<option ${val===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
  }
  if(f.type==='multi_choice'){
    const arr=Array.isArray(val)?val:[];
    return `<div class="fv-multi">${f.options.map(o=>`<label><input type="checkbox" ${name} value="${esc(o)}" ${arr.includes(o)?'checked':''}>${esc(o)}</label>`).join('')}</div>`;
  }
  return '';
}
function fieldsSection(catId,vals){
  const list=fieldsOf(catId);
  if(!list.length)return `<div class="cbody sub" style="padding:2px 0 4px">该分类暂无自定义字段（可在工具栏「字段管理」中添加）</div>`;
  return list.map(f=>`<div class="frow"><label>${esc(f.name)}</label>${fvInput(f,vals[f.id])}</div>`).join('');
}
function openItemModal(id,preSd){
  closePop();
  const isNew=id===null;
  const it=isNew?null:state.items.find(x=>x.id===id);
  const curCat=isNew?activeCatId():it.cat;
  const catId=isNew?(curCat!==null?curCat:state.categories.find(c=>c.kind==='normal').id):it.cat;
  // 分类下拉顺序与界面标签栏一致：普通分类按序，未分类沉底（v1.17）
  const catOpts=[...state.categories.filter(c=>c.kind==='normal'),...state.categories.filter(c=>c.kind==='uncategorized')]
    .map(c=>`<option value="${c.id}" ${c.id===catId?'selected':''}>${esc(c.name)}</option>`).join('');
  modal(`<div class="dhead">${isNew?'新增事项':'编辑事项'}<button class="x" onclick="closeModal()">✕</button></div>
    <div class="dbody" id="item-form">
      <input type="hidden" id="if-id" value="${isNew?'':id}">
      ${isNew&&curCat!==null?'':`<div class="frow"><label>所属分类</label><select id="if-cat" onchange="onCatChange(this.value)">${catOpts}</select></div>`}
      <div class="frow"><label>标题 *</label><input type="text" id="if-title" maxlength="100" value="${it?esc(it.title):''}"></div>
      <div class="frow"><label>描述</label><textarea id="if-desc" rows="5">${it?esc(it.desc):''}</textarea></div>
      <div class="frow"><label>开始时间</label>
        ${segDateHtml('if-sd',it?it.sd:(preSd||''))}${segTimeHtml('if-st',it?it.st:'')}</div>
      <div class="frow"><label>结束时间</label>
        ${segDateHtml('if-ed',it?it.ed:(preSd||''))}${segTimeHtml('if-et',it?it.et:'')}</div>
      <div class="frow"><label>截止时间</label>
        ${segDateHtml('if-dd',it?it.dd:'')}${segTimeHtml('if-dt',it?it.dt:'')}</div>
      <div class="fsec"><div class="sec-t">自定义字段（显示当前分类可见的字段；数据全分类通用，切分类不丢失）</div>
        <div id="if-fields">${fieldsSection(catId,it?it.fv:{})}</div></div>
      <div class="ferr" id="if-err"></div>
    </div>
    <div class="dfoot">
      ${isNew?'':`<button class="btn-danger" style="margin-right:auto" onclick="askDeleteItem(${id})">删除</button>`}
      <button class="btn-ghost" onclick="closeModal()">取消</button>
      <button class="btn-primary" onclick="saveItem()">保存</button>
    </div>`,false,true);

function onCatChange(newCat){
  const id=Number($('#if-id').value);
  const it=state.items.find(x=>x.id===id);
  $('#if-fields').innerHTML=fieldsSection(Number(newCat),it?it.fv:{});
}
function collectFV(){
  const fv={};
  document.querySelectorAll('#if-fields [data-fv]').forEach(el=>{
    const k=el.dataset.fv;
    if(el.type==='checkbox'){
      if(el.checked){(fv[k]=fv[k]||[]).push(el.value)}
    }else{fv[k]=el.value!==''?el.value:null}
  });
  return fv;
}
function saveItem(){
  const idStr=$('#if-id').value;
  const title=$('#if-title').value.trim();
  const err=$('#if-err');
  const sd=segVal('if-sd'),ed=segVal('if-ed');
  if(!title){err.textContent='标题不能为空';err.classList.add('show');return}
  if(sd&&ed&&ed<sd){err.textContent='结束时间的日期不能早于开始时间';err.classList.add('show');return}
  const base={title,desc:$('#if-desc').value,sd,st:segVal('if-st'),ed,et:segVal('if-et'),
    dd:segVal('if-dd'),dt:segVal('if-dt')};
  if(idStr===''){
    state.items.push({id:itemSeq++,cat:$('#if-cat')?Number($('#if-cat').value):activeCatId(),fv:collectFV(),...base});
    toast('已保存：按归属规则进入'+(base.sd&&base.ed?'日历':'待办'));
  }else{
    const id=Number(idStr);
    const it=state.items.find(x=>x.id===id);
    const catId=$('#if-cat')?Number($('#if-cat').value):it.cat;
    // 字段值：仅覆盖当前模板内的字段，其他分类的字段值原样保留（PRD 4.3）
    const old=it.fv,newFv=collectFV();
    const merged={...old};
    fieldsOf(catId).forEach(f=>{merged[f.id]=newFv[f.id]!==undefined?newFv[f.id]:null});
    Object.assign(it,base,{cat:catId,fv:merged});
    toast('已保存：归属已按规则自动迁移');
  }
  closeModal();renderAll();
}
function askDeleteItem(id){
  const it=state.items.find(x=>x.id===id);
  confirmBox(`确定删除事项【${esc(it.title)}】？此操作计入撤销栈，可 Ctrl+Z 撤销。`,
    {danger:true,okText:'删除',onOk(){
      state.items=state.items.filter(x=>x.id!==id);
      closeModal();renderAll();toast('事项已删除');
    }});
}

/* ================= +N 当日浮层 ================= */

    .sort((a,b)=>(a.st||'00:00')<(b.st||'00:00')?-1:(a.st||'00:00')>(b.st||'00:00')?1:a.id-b.id);

}

/* ================= 字段管理（全局字段 + 分类可见性，PRD 4.3 v1.17） ================= */

function visLabel(f){

  modal(`<div class="dhead">字段管理<button class="x" onclick="closeModal()">✕</button></div>
    <div class="dbody" style="min-width:460px">
      <div class="note" style="margin-bottom:6px">· 自定义字段<b>全部分类通用</b>（数据跟随事项，切分类不丢失）；每个分类可配置显示哪些字段。</div>
      ${list.length?list.map((f,i)=>`
        <div class="fm-row">
          <span class="fname">${esc(f.name)}</span>
          <span class="ftype">${TYPE_LABEL[f.type]}</span>
          <span class="fopt">${isChoice(f.type)?(f.options.length+' 选项'):'—'}</span>
          <button class="vis-tag" onclick="fmVisOpen=fmVisOpen===${f.id}?null:${f.id};renderFm()" title="配置可见分类">可见：${visLabel(f)}</button>
          <button class="op ${i===0?'dis':''}" onclick="fmMove(${f.id},-1)">↑</button>
          <button class="op ${i===list.length-1?'dis':''}" onclick="fmMove(${f.id},1)">↓</button>
          <button class="op" title="编辑" onclick="fmEdit(${f.id})">✎</button>
          <button class="op" title="删除" onclick="fmDeleteAsk(${f.id})">🗑</button>
        </div>${visRow(f)}`).join('')
      :`<div class="tempty">暂无自定义字段</div>`}
      ${editingForm}
      ${editing?'':`<div class="dfoot" style="justify-content:flex-start;padding:8px 0 0">
        <button class="btn-primary" onclick="fmEdit('new')">＋ 新增字段</button></div>`}
    </div>`);
  const sel=$('#fm-type');
  if(sel)sel.onchange=()=>{$('#fm-optrow').style.display=isChoice(sel.value)?'flex':'none'};
}
function fmEdit(fid){
  if(fid==='new'){
    // 新字段默认全部分类可见（PRD 4.3 v1.17：定义全局，C 分类也能看到）
    const f={id:fSeq++,name:'新字段',type:'text',options:null,sort:state.fields.length+1,
      vis:state.categories.map(c=>c.id)};
    state.fields.push(f);fmEditing=f.id;
  }else{fmEditing=fid}
  renderFm();
}
function fmToggleVis(fid,catId,on){
  const f=state.fields.find(x=>x.id===fid);if(!f)return;
  if(on){if(!f.vis.includes(catId))f.vis.push(catId)}
  else f.vis=f.vis.filter(x=>x!==catId);
  renderFm();
}
function fmSubmit(fid){
  const name=$('#fm-name').value.trim();
  if(!name){toast('字段名称不能为空');return}
  const type=$('#fm-type').value;
  const f=state.fields.find(x=>x.id===fid);
  let opts=null;
  if(isChoice(type)){
    opts=$('#fm-opts').value.split(/[,，]/).map(s=>s.trim()).filter(Boolean);
    if(!opts.length){toast('单选/多选至少需要一个选项');return}
  }
  const finish=()=>{f.name=name;f.type=type;f.options=opts;fmEditing=null;renderFm();toast('已保存')};
  if(f.type===type){finish();return}
  const zeroLoss=isChoice(type)&&!isChoice(f.type); // 转单选/多选：历史值去重生成选项，零丢失（PRD 6.6 v1.2）
  const rule=zeroLoss
    ? '该字段此前没有选项列表：将把<b>全部历史值字符串化去重生成选项</b>，所有原值保留（零丢失）。'
    : isChoice(f.type)&&isChoice(type)
      ? '按原选项列表校验：值命中选项则保留（多选→单选保留第一个选中项），未命中的清空。'
      : '能转换的历史数据转换后保留，不能转换的<b>清空</b>（详见 PRD 6.6 转换矩阵；正式版将实际迁移数据）。';
  confirmBox(`修改为【${TYPE_LABEL[type]}】的规则：<br>${rule}`,{danger:!zeroLoss,okText:'确认修改',onOk:finish});
}
function fmMove(fid,dir){
  const list=[...state.fields].sort((a,b)=>a.sort-b.sort);
  const i=list.findIndex(f=>f.id===fid),j=i+dir;
  if(j<0||j>=list.length)return;
  [list[i].sort,list[j].sort]=[list[j].sort,list[i].sort];
  renderFm();
}
function fmDeleteAsk(fid){
  const f=state.fields.find(x=>x.id===fid);
  confirmBox(`确定删除字段【${esc(f.name)}】？<br><span class="sub">将丢失该字段下所有已填写数据。</span>`,
    {danger:true,okText:'删除',onOk(){
      state.fields=state.fields.filter(x=>x.id!==fid);
      state.items.forEach(it=>{if(it.fv)delete it.fv[fid]});
      fmEditing=null;renderFm();toast('字段已删除');
    }});
}

        <button class="${settingsTab==='daytypes'?'on':''}" onclick="settingsTabSwitch('daytypes')">日期类型</button>
        <button class="dis">邮箱绑定 <span class="badge">二期</span></button>
        <button class="dis">提醒发送记录 <span class="badge">二期</span></button>

function dtGridHtml(){
  const first=dtCursor.slice(0,8)+'01',ws=weekStart(first);
  const nRows=Math.ceil((diffDays(ws,first)+daysInMonth(dtCursor))/7);
  let cells='';
  for(let r=0;r<nRows;r++)for(let i=0;i<7;i++){
    const ds=addDays(ws,r*7+i);
    const dim=ds.slice(0,7)!==dtCursor.slice(0,7);
    const dt=dayTypeOf(ds);
    cells+=`<div class="dt-cell ${dim?'dim':''}" onclick="dtCycle('${ds}',1)">${Number(ds.slice(8))}<span class="dtype ${dt}">${DTYPE_LABEL[dt]}</span></div>`;
  }
  return cells;
}

/* ================= 导出 TXT：范围选择弹窗（PRD 6.9，v1.14） ================= */
/* TXT 导出日期工具（全局）：dimDays/limitStart/fillTxtRange（PRD 6.9 v1.14 + 快捷范围 v1.15） */
function dimDays(yy,mm){return mm===2?((yy%4===0&&yy%100!==0)||yy%400===0?29:28):[31,28,31,30,31,30,31,31,30,31,30,31][mm-1]}
function p2(n){return String(n).padStart(2,'0')}
function todayStr(){return TODAY}
/* 快捷范围：'w'=今天+7 天；1/2=今天+N 个月−1 天（钳制同上）；开始一律=今天 */
function fillTxtRange(unit){
  const today=todayStr();
  const [a,b,c]=today.split('-').map(Number);
  let ed;
  if(unit==='w'){
    const dt=new Date(a,b-1,c+7);
    ed=`${dt.getFullYear()}-${p2(dt.getMonth()+1)}-${p2(dt.getDate())}`;
  }else{
    const tt=a*12+(b-1)+unit, y2=Math.floor(tt/12), m2=tt%12+1;
    const cl=Math.min(c,dimDays(y2,m2));
    if(cl>=2)ed=`${y2}-${p2(m2)}-${p2(cl-1)}`;
    else{const t=y2*12+(m2-1)-1, y3=Math.floor(t/12), m3=t%12+1;ed=`${y3}-${p2(m3)}-${p2(dimDays(y3,m3))}`}
  }
  setSegDate('tx-sd',today); setSegDate('tx-ed',ed);
  toast(`已填入：${today} ~ ${ed}`);
}
function openTxtExport(){
  const now=new Date();
  const y=now.getFullYear(), m=now.getMonth()+1;
  const nm=m===12?1:m+1, ny=m===12?y+1:y;
  const sd=`${y}-${p2(m)}-01`, ed=`${ny}-${p2(nm)}-${p2(dimDays(ny,nm))}`;
  modal(`<div class="dhead">导出 TXT<button class="x" onclick="closeModal()">✕</button></div>
    <div class="dbody"><div class="iform">
      <div class="frow"><label>快捷范围</label><span class="chips">
        <button type="button" class="chip" onclick="fillTxtRange('w')">一周内</button>
        <button type="button" class="chip" onclick="fillTxtRange(1)">一个月内</button>
        <button type="button" class="chip" onclick="fillTxtRange(2)">两个月内</button>
      </span></div>
      <div class="frow"><label>开始日期</label>${segDateHtml('tx-sd',sd)}<span style="flex:1"></span></div>
      <div class="frow"><label>结束日期</label>${segDateHtml('tx-ed',ed)}</div>
    </div>
    <div class="note">
      · 默认当前月+下一个自然月；结束日期最晚为开始日期+6 个月。<br>
      · 日期/时刻框：直接键入数字（分段选中）；点右侧图标弹出选择器。<br>
      · 日历事项与范围有交集即导出（显示自身起止）；待办按截止日期，无截止不导出。
    </div></div>
    <div class="dfoot">
      <span style="flex:1"></span>
      <button class="btn-ghost" onclick="closeModal()">取消</button>
      <button class="btn-primary" onclick="const s=segVal('tx-sd'),e2=segVal('tx-ed');toast(s&&e2?('演示原型：按 '+s+'~'+e2+' 导出 txt（正式版实现）'):'请先填完整的开始与结束日期')">选择位置并导出</button>
    </div>`);
  initSegs(document.querySelector('.dialog .dbody'));
}

/* ================= 撤销（演示） ================= */
function undoDemo(){toast('演示原型：撤销逻辑在正式版实现（最多 10 步，重启清空）')}
function redoDemo(){toast('演示原型：重做逻辑在正式版实现')}
document.addEventListener('keydown',e=>{
  if(!(e.ctrlKey||e.metaKey))return;
  const tag=(document.activeElement&&document.activeElement.tagName)||'';
  if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT')return; // 文本级撤销交给输入框
  if(e.key==='z'||e.key==='Z'){e.preventDefault();undoDemo()}
  if(e.key==='y'||e.key==='Y'){e.preventDefault();redoDemo()}
});
